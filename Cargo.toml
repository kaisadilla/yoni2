[package]
name = "yoni2"
version = "0.1.0"
edition = "2024"

[dependencies]
poise = "0.7.1"
tokio = { version = "*", features = ["full"] }
dotenvy = "*"
anyhow = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter"] }
toml = "*"
sqlx = { version = "*", features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
include_dir = "0.7.4"
rand = "0.10.3"
regex = "1.13.1"
image = { version = "0.25.10", features = ["gif"] }
ab_glyph = "0.2.32"
imageproc = { version = "0.27.0", features = ["text"] }
reqwest = { version = "0.13.5", features = ["stream"] }
futures-util = "0.3.34"
sha2 = "0.11.1"
image_hasher = "3.1.1"
