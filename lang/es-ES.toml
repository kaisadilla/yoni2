[commands.help]
name = "ayuda"
desc = "Descubre quién es Yoni y cuáles son sus comandos."
reply.title = "Ayuda"
reply.body = '''
# HOLA, SOY YONI

Soy el esclavo y mensajero de Rigoberta. Estoy aquí para comunicar todo lo que ella diga.

Como no tengo libertad de expresión y todo lo que digo viene de la boca de Rigoberta es posible que me oigas decir cosas como "Yoni vete a tomar por culo". Estaré en el canal de <#{channel_oratorio_id}> respondiendo vuestros rezos, en el de <#{channel_yoni_id}> respondiendo lo que me digáis y vuestros comandos y en el de <#{channel_comandos_id}> respondiendo a vuestros comandos.

Dicho esto, estos son los comandos que tengo disponibles:
 - `/help`: utilízalo cada vez que necesites volver a leer este mensaje.
 - `/comandos`: para solo ver los comandos que tengo disponibles, sin la presentación.
 - `/preséntate`: para leer la presentación de quién soy, sin los comandos.
 - `/novedades`: consulta cuáles son las novedades de Yoni respecto a la anterior versión.
 - `/insulta`: utilízalo para que insulte a alguien de tu parte.
 - `/bendice`: para bendecir a quien tú quieras.
 - `/metesela`: haz que le meta lo que tengo ahí colgado a quien tú me digas.
 - `/habla`: para que diga algo.
 - `/gif`: para que ponga alguno de mis gifs favoritos.
 - `/record mierda`: consulta el número de días que lleva Mike sin decir cosas relacionadas a cagar y cuál es el récord.
 - `/hilos bloquear`: bloquea a un usuario de los hilos de los que seas autor original en <#{channel_hilos_id}> para que no pueda escribir más ahí.
 - `/hilos desbloquear`: desbloquea a un usuario de los hilos de los que seas autor original en <#{channel_hilos_id}>  para que pueda volver a escribir ahí.

Recuerda que si encuentras un bug o tienes una sugerencia, puedes contactar con mi dueño (Rede944) creando un hilo en <#{channel_bugs_id}>.
'''

