[commands.help]
name = "ayuda"
desc = "Descubre quién es Yoni y cuáles son sus comandos."
reply.title = "Ayuda"
reply.body = '''
# HOLA, SOY YONI

Soy el esclavo y mensajero de Rigoberta. Aunque tengo libre albedrío, Rigoberta es capaz de canalizar sus mensajes a través de mi - incluso cuando esos mensajes incluyen vejarme.

Como no tengo libertad de expresión y todo lo que digo viene de la boca de Rigoberta es posible que me oigas decir cosas como "Yoni vete a tomar por culo". Estaré en el canal de {channel_oratorio_mention} respondiendo vuestros rezos, en el de {channel_yoni_mention} respondiendo lo que me digáis y vuestros comandos y en el de {channel_comandos_mention} respondiendo a vuestros comandos.

## ¿Qué puedo hacer?
- Interactuar con otros usuarios con comandos como `/bendecir` o `/insultar`.
- Hablar contigo en los canales de {channel_yoni_mention} y {channel_oratorio_mention}.
- Ayudarte a gestionar tus hilos en {channel_hilos_mention} con comandos como `/borrar` o /hilo *`.
- Enviar GIFs. ¡Muchos GIFs!
- Mostrar ránkings y récords estúpidos del servidor.
- ¡Y muchas cosas más! (trust me).

### Puedes ver mis comandos escribiendo `/` y buscando la sección de Yoni. También puedes usar mis comandos simplemente diciendo "yoni" y el comando - por ejemplo, "yoni bendice @/Alguien" o "yoni gif".

Recuerda que si encuentras un bug o tienes una sugerencia, puedes contactar con mi dueño (Rede944) creando un hilo en {channel_bugs_mention}.
'''
reply.obsolete.commands = """
Dicho esto, estos son los comandos que tengo disponibles:
 - `/help`: utilízalo cada vez que necesites volver a leer este mensaje.
 - `/insultar`: utilízalo para que insulte a alguien de tu parte.
 - `/bendecir`: para bendecir a quien tú quieras.
 - `/métesela`: haz que le meta lo que tengo ahí colgado a quien tú me digas.
 - `/habla`: para que diga algo.
 - `/gif`: para que ponga alguno de mis gifs favoritos.
 - `/record mierda`: consulta el número de días que lleva Mike sin decir cosas relacionadas a cagar y cuál es el récord.
 - `/hilos bloquear`: bloquea a un usuario de los hilos de los que seas autor original en <#{channel_hilos_id}> para que no pueda escribir más ahí.
 - `/hilos desbloquear`: desbloquea a un usuario de los hilos de los que seas autor original en <#{channel_hilos_id}>  para que pueda volver a escribir ahí.
"""

