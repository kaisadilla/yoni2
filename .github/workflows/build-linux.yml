name: Build Yoni (Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libsqlite3-dev

      - name: Build
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu

      - name: Prepare binary
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/yoni2 dist/yoni2
          file dist/yoni2

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: yoni2-linux-x86_64
          path: dist/yoni2
          if-no-files-found: error